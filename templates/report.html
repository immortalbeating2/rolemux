<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #1d2430;
        --muted: #637083;
        --border: #d8dee8;
        --accent: #0f766e;
        --danger: #b42318;
        --code: #101828;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --panel: #181d24;
          --text: #edf1f7;
          --muted: #a5afbf;
          --border: #303846;
          --accent: #2dd4bf;
          --danger: #fb7185;
          --code: #f8fafc;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: grid;
        gap: 8px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 18px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 2px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
      }

      .badge.status-success {
        border-color: var(--accent);
        color: var(--accent);
      }

      .badge.status-failed,
      .badge.status-timeout {
        border-color: var(--danger);
        color: var(--danger);
      }

      section {
        margin-top: 24px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }

      pre {
        margin: 12px 0 0;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--code);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      }

      dl {
        display: grid;
        grid-template-columns: minmax(120px, 180px) 1fr;
        gap: 8px 16px;
        margin: 12px 0 0;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 1120px);
          padding: 20px 0;
        }

        dl {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>{{title}}</h1>
        <div class="meta">
          <span class="badge status-{{status}}">{{status}}</span>
          <span class="badge">Task {{taskId}}</span>
          <span class="badge">{{provider}} / {{role}}</span>
        </div>
      </header>

      <section>
        <h2>Summary</h2>
        <dl>
          <dt>Task ID</dt>
          <dd>{{taskId}}</dd>
          <dt>Status</dt>
          <dd>{{status}}</dd>
          <dt>Provider</dt>
          <dd>{{provider}}</dd>
          <dt>Role</dt>
          <dd>{{role}}</dd>
        </dl>
      </section>

      <section>
        <h2>Task</h2>
        <pre>{{task}}</pre>
      </section>

      <section>
        <h2>Output</h2>
        <pre>{{output}}</pre>
      </section>

      <section>
        <h2>Stderr</h2>
        <pre>{{stderr}}</pre>
      </section>

      <section>
        <h2>Metadata</h2>
        <pre>{{metadataJson}}</pre>
      </section>
    </main>
  </body>
</html>
